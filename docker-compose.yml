services:
  postgres:
    image: postgres:17-alpine
    container_name: devicefy-postgres
    environment:
      POSTGRES_DB: devicefy
      POSTGRES_USER: devicefy
      POSTGRES_PASSWORD: devicefy
    ports:
      - "5432:5432"
    volumes:
      - devicefy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devicefy -d devicefy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devicefy_pgdata:
